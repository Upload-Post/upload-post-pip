name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ['setup.py', 'setup.cfg', 'pyproject.toml']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build only, no publish)'
        required: true
        default: true
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      # setup.py y upload_post/__init__.py llevaban versiones distintas (2.8.1 y
      # 2.8.0): se publicaba un paquete cuyo __version__ mentia a quien lo leyera
      # desde el propio cliente. Nadie se entero hasta que se miro a mano.
      - name: Version files must agree
        shell: bash
        run: |
          SETUP=$(sed -n 's/.*version="\([^"]*\)".*/\1/p' setup.py | head -1)
          INIT=$(sed -n 's/.*__version__ = "\([^"]*\)".*/\1/p' upload_post/__init__.py | head -1)
          echo "setup.py=$SETUP  __init__.py=$INIT"
          if [ -z "$SETUP" ] || [ -z "$INIT" ]; then
            echo "::error::No se pudo leer la version de setup.py o de upload_post/__init__.py"
            exit 1
          fi
          if [ "$SETUP" != "$INIT" ]; then
            echo "::error::Version descuadrada: setup.py=$SETUP pero __init__.py=$INIT. Publicar asi deja un __version__ que miente."
            exit 1
          fi

      - name: Check if version is new
        id: version_check
        shell: bash
        run: |
          LOCAL=$(sed -n 's/.*version="\([^"]*\)".*/\1/p' setup.py | head -1)
          PKG_NAME=$(sed -n 's/.*name="\([^"]*\)".*/\1/p' setup.py | head -1)
          REMOTE=$(pip index versions "$PKG_NAME" 2>/dev/null | grep -oP '\(\K[^)]+' | head -1 || echo "0.0.0")
          echo "local=$LOCAL" >> $GITHUB_OUTPUT
          echo "remote=$REMOTE" >> $GITHUB_OUTPUT
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "new=false" >> $GITHUB_OUTPUT
            echo "⏭️ Version $LOCAL already published, skipping."
          else
            echo "new=true" >> $GITHUB_OUTPUT
            echo "🚀 New version detected: $REMOTE → $LOCAL"
          fi

      - name: Build package
        if: steps.version_check.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        run: python -m build

      - name: Show built packages (dry-run)
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "📦 Built packages:"
          ls -la dist/
          echo "✅ Dry run complete - no publish"

      - name: Publish to PyPI
        if: (steps.version_check.outputs.new == 'true' && inputs.dry_run != true) || github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1
